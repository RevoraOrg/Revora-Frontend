<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96" role="img" aria-labelledby="title">
  <title id="title">No delegates — delegate with two delegation chain links</title>
  <defs>
    <filter id="es-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" floodColor="rgba(0,0,0,0.25)" />
    </filter>
  </defs>
  <rect width="96" height="96" fill="#ffffff" />
  <g filter="url(#es-shadow)" transform="translate(48 48)">
    <circle r="44" fill="rgba(15,23,42,0.6)" stroke="rgba(148,163,184,0.2)" stroke-width="1.5" />
    <circle r="30" fill="rgba(15,23,42,0.4)" stroke="rgba(148,163,184,0.12)" stroke-width="1.5" />
    <circle r="30" fill="none" stroke="#3b82f6" stroke-opacity="0.22" stroke-width="3" stroke-dasharray="10 8" transform="rotate(-20)" />
    <!-- Delegate head -->
    <circle cx="-6" cy="-8" r="6" fill="#3b82f6" fill-opacity="0.1" stroke="#3b82f6" stroke-opacity="0.4" stroke-width="2" />
    <!-- Delegate shoulders -->
    <path d="M-17 11 C-17 2 -13 -2 -6 -2 C1 -2 5 2 5 11" fill="#3b82f6" fill-opacity="0.1" stroke="#3b82f6" stroke-opacity="0.4" stroke-width="2" />
    <!-- Delegation chain links -->
    <rect x="7" y="-10" width="10" height="7" rx="3.5" fill="#38bdf8" fill-opacity="0.12" stroke="#38bdf8" stroke-opacity="0.6" stroke-width="1.8" />
    <rect x="14" y="-3" width="10" height="7" rx="3.5" fill="#38bdf8" fill-opacity="0.18" stroke="#38bdf8" stroke-opacity="0.7" stroke-width="1.8" />
    <line x1="14" y1="-6.5" x2="14.5" y2="-1" stroke="#38bdf8" stroke-opacity="0.5" stroke-width="1.5" />
  </g>
</svg>
