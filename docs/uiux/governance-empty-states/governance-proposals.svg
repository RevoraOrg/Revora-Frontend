<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96" role="img" aria-labelledby="title">
  <title id="title">No active proposals — stacked proposal documents with a create badge</title>
  <defs>
    <filter id="es-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" floodColor="rgba(0,0,0,0.25)" />
    </filter>
  </defs>
  <rect width="96" height="96" fill="#ffffff" />
  <g filter="url(#es-shadow)" transform="translate(48 48)">
    <circle r="44" fill="rgba(15,23,42,0.6)" stroke="rgba(148,163,184,0.2)" stroke-width="1.5" />
    <circle r="30" fill="rgba(15,23,42,0.4)" stroke="rgba(148,163,184,0.12)" stroke-width="1.5" />
    <circle r="30" fill="none" stroke="#3b82f6" stroke-opacity="0.22" stroke-width="3" stroke-dasharray="10 8" transform="rotate(-20)" />
    <!-- Back proposal document (stacked, offset) -->
    <rect x="-14" y="-11" width="21" height="27" rx="2.5" transform="rotate(-8 0 0)" fill="#cbd5e1" fill-opacity="0.08" stroke="#cbd5e1" stroke-opacity="0.3" stroke-width="2" />
    <!-- Front proposal document -->
    <rect x="-11" y="-14" width="21" height="27" rx="2.5" fill="#3b82f6" fill-opacity="0.08" stroke="#3b82f6" stroke-opacity="0.45" stroke-width="2" />
    <!-- Fold corner -->
    <path d="M5 -14 L10 -9 L5 -9 Z" fill="#3b82f6" fill-opacity="0.15" />
    <!-- Proposal body lines -->
    <line x1="-6" y1="-6" x2="6" y2="-6" stroke="#cbd5e1" stroke-opacity="0.4" stroke-width="1.5" stroke-linecap="round" />
    <line x1="-6" y1="0" x2="3" y2="0" stroke="#cbd5e1" stroke-opacity="0.4" stroke-width="1.5" stroke-linecap="round" />
    <line x1="-6" y1="6" x2="5" y2="6" stroke="#cbd5e1" stroke-opacity="0.4" stroke-width="1.5" stroke-linecap="round" />
    <!-- Create badge -->
    <circle cx="8" cy="7" r="7" fill="#3b82f6" />
    <circle cx="8" cy="7" r="9" fill="none" stroke="#3b82f6" stroke-opacity="0.3" stroke-width="1.5" />
    <path d="M8 3.5 L8 10.5 M4.5 7 L11.5 7" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" />
  </g>
</svg>
