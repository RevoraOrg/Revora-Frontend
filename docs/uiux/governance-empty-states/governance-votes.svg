<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96" role="img" aria-labelledby="title">
  <title id="title">No votes cast — empty ballot box with a ballot slipping into the slot</title>
  <defs>
    <filter id="es-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" floodColor="rgba(0,0,0,0.25)" />
    </filter>
  </defs>
  <rect width="96" height="96" fill="#ffffff" />
  <g filter="url(#es-shadow)" transform="translate(48 48)">
    <circle r="44" fill="rgba(15,23,42,0.6)" stroke="rgba(148,163,184,0.2)" stroke-width="1.5" />
    <circle r="30" fill="rgba(15,23,42,0.4)" stroke="rgba(148,163,184,0.12)" stroke-width="1.5" />
    <circle r="30" fill="none" stroke="#3b82f6" stroke-opacity="0.22" stroke-width="3" stroke-dasharray="10 8" transform="rotate(-20)" />
    <!-- Ballot box body -->
    <rect x="-15" y="2" width="30" height="18" rx="2.5" fill="#3b82f6" fill-opacity="0.08" stroke="#3b82f6" stroke-opacity="0.4" stroke-width="2" />
    <!-- Ballot slot lid -->
    <rect x="-15" y="-2" width="30" height="5" rx="2.5" fill="#3b82f6" fill-opacity="0.18" />
    <line x1="-15" y1="-2" x2="15" y2="-2" stroke="#3b82f6" stroke-opacity="0.5" stroke-width="2" />
    <!-- Tally marks inside the box -->
    <line x1="-10" y1="8" x2="-2" y2="8" stroke="#cbd5e1" stroke-opacity="0.4" stroke-width="1.5" stroke-linecap="round" />
    <line x1="-10" y1="13" x2="2" y2="13" stroke="#cbd5e1" stroke-opacity="0.4" stroke-width="1.5" stroke-linecap="round" />
    <line x1="-10" y1="18" x2="0" y2="18" stroke="#cbd5e1" stroke-opacity="0.4" stroke-width="1.5" stroke-linecap="round" />
    <!-- Ballot card slipping into the slot -->
    <rect x="-4" y="-14" width="8" height="13" rx="1.5" fill="#38bdf8" fill-opacity="0.12" stroke="#38bdf8" stroke-opacity="0.5" stroke-width="1.5" />
    <!-- Check mark on the ballot -->
    <path d="M-1.5 -8.5 L0.5 -6 L3.5 -10" stroke="#3b82f6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  </g>
</svg>
